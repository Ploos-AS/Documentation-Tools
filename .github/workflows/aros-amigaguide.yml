name: AROS AmigaGuide qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  aros-native-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build qualification fixture
        run: |
          mkdir -p dist
          python3 tools/validate-docs.py examples/ExampleAmigaManual.md
          python3 tools/build-amigaguide.py examples/ExampleAmigaManual.md dist/ExampleAmiga.guide
          python3 tools/validate-amigaguide.py dist/ExampleAmiga.guide
          sha256sum dist/ExampleAmiga.guide | tee dist/ExampleAmiga.guide.sha256

      - name: Install probe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils xvfb

      - name: Resolve current AROS ABIv11 Linux hosted GitHub release
        id: aros
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(curl -fsSL --retry 3 'https://api.github.com/repos/deadwood2/AROS/releases/latest')"
          python3 - "$GITHUB_OUTPUT" <<'PY' <<<"$release_json"
          import json
          import sys

          data = json.load(sys.stdin)
          assets = [a for a in data.get("assets", []) if "linux-x86_64-system" in a.get("name", "")]
          if len(assets) != 1:
              raise SystemExit(f"expected exactly one linux-x86_64-system asset, found {len(assets)}")
          asset = assets[0]
          digest = asset.get("digest", "")
          if not digest.startswith("sha256:"):
              raise SystemExit("GitHub release asset has no SHA-256 digest")
          with open(sys.argv[1], "a", encoding="utf-8") as output:
              output.write(f"tag={data['tag_name']}\n")
              output.write(f"url={asset['browser_download_url']}\n")
              output.write(f"sha256={digest.removeprefix('sha256:')}\n")
          print(f"Resolved AROS {data['tag_name']}: {asset['name']}")
          PY

      - name: Download and verify AROS hosted runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .aros/root
          curl -fL --retry 3 '${{ steps.aros.outputs.url }}' -o .aros/aros-system.tar.gz
          printf '%s  %s\n' '${{ steps.aros.outputs.sha256 }}' '.aros/aros-system.tar.gz' | sha256sum -c -
          tar -xzf .aros/aros-system.tar.gz -C .aros/root

      - name: Inspect AROS runtime and native viewer
        shell: bash
        run: |
          set -euo pipefail
          find .aros/root -type f \( -iname 'AROSBootstrap' -o -iname 'MultiView' -o -iname 'AmigaGuide*' \) -print | tee dist/aros-runtime-inventory.txt
          grep -qi '/AROSBootstrap$' dist/aros-runtime-inventory.txt
          if ! grep -Eqi '/(MultiView|AmigaGuide[^/]*)$' dist/aros-runtime-inventory.txt; then
            echo 'AROS runtime found, but no native AmigaGuide-capable viewer was discovered.'
            exit 1
          fi

      - name: Record AROS qualification probe
        run: |
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "aros_release=${{ steps.aros.outputs.tag }}"
            echo "aros_asset=${{ steps.aros.outputs.url }}"
            echo "aros_asset_sha256=${{ steps.aros.outputs.sha256 }}"
            echo "fixture_sha256=$(cut -d' ' -f1 dist/ExampleAmiga.guide.sha256)"
            echo 'result=AROS runtime and native viewer discovered; interactive viewer execution is the next gate'
          } | tee dist/aros-amigaguide-probe.txt

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aros-amigaguide-probe
          path: |
            dist/ExampleAmiga.guide
            dist/ExampleAmiga.guide.sha256
            dist/aros-runtime-inventory.txt
            dist/aros-amigaguide-probe.txt
          if-no-files-found: warn
