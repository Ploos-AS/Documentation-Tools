name: AROS AmigaGuide qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  aros-native-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build qualification fixture
        run: |
          mkdir -p dist
          python3 tools/validate-docs.py examples/ExampleAmigaManual.md
          python3 tools/build-amigaguide.py examples/ExampleAmigaManual.md dist/ExampleAmiga.guide
          python3 tools/validate-amigaguide.py dist/ExampleAmiga.guide
          sha256sum dist/ExampleAmiga.guide | tee dist/ExampleAmiga.guide.sha256

      - name: Install qualification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils xvfb x11-utils imagemagick

      - name: Resolve current AROS ABIv11 Linux hosted GitHub release
        id: aros
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' 'https://api.github.com/repos/deadwood2/AROS/releases/latest' -o "$RUNNER_TEMP/aros-release.json"
          python3 - "$GITHUB_OUTPUT" "$RUNNER_TEMP/aros-release.json" <<'PY'
          import json, sys
          output_path, release_path = sys.argv[1:3]
          with open(release_path, encoding="utf-8") as source:
              data = json.load(source)
          assets = [a for a in data.get("assets", []) if "linux-x86_64-system" in a.get("name", "")]
          if len(assets) != 1:
              raise SystemExit(f"expected exactly one linux-x86_64-system asset, found {len(assets)}")
          asset = assets[0]
          digest = asset.get("digest", "")
          if not digest.startswith("sha256:"):
              raise SystemExit("GitHub release asset has no SHA-256 digest")
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"tag={data['tag_name']}\nurl={asset['browser_download_url']}\nsha256={digest.removeprefix('sha256:')}\n")
          PY

      - name: Download and verify AROS hosted runtime
        run: |
          set -euo pipefail
          mkdir -p .aros/root
          curl -fL --retry 3 '${{ steps.aros.outputs.url }}' -o .aros/aros-system.tar.gz
          printf '%s  %s\n' '${{ steps.aros.outputs.sha256 }}' '.aros/aros-system.tar.gz' | sha256sum -c -
          tar -xzf .aros/aros-system.tar.gz -C .aros/root

      - name: Locate hosted AROS runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          bootstrap="$(find .aros/root -type f -iname AROSBootstrap | head -n1)"
          test -n "$bootstrap"
          chmod +x "$bootstrap"
          aros_root="$(cd "$(dirname "$bootstrap")/../.." && pwd)"
          echo "aros_root=$aros_root" >> "$GITHUB_OUTPUT"
          test -x "$aros_root/Utilities/MultiView"
          test -s "$aros_root/Libs/amigaguide.library"
          test -s "$aros_root/Classes/DataTypes/amigaguide.datatype"
          cp "$aros_root/boot/linux/AROSBootstrap.conf" dist/AROSBootstrap.conf
          cp "$aros_root/S/Startup-Sequence" dist/Startup-Sequence.original

      - name: Install native qualification hook
        shell: bash
        run: |
          set -euo pipefail
          aros_root='${{ steps.runtime.outputs.aros_root }}'
          cp dist/ExampleAmiga.guide "$aros_root/ExampleAmiga.guide"
          if [ -e "$aros_root/S/User-Startup" ]; then
            cp "$aros_root/S/User-Startup" dist/User-Startup.original
          fi
          cat > "$aros_root/S/User-Startup" <<'AROS'
          Echo "DT_USER_STARTUP_ENTERED" >SYS:dt-user-startup-entered.txt
          Run >NIL: <NIL: SYS:Utilities/MultiView SYS:ExampleAmiga.guide
          Echo "DT_MULTIVIEW_LAUNCHED" >SYS:dt-multiview-launched.txt
          AROS

      - name: Execute generated guide in hosted AROS
        shell: bash
        run: |
          set -euo pipefail
          aros_root='${{ steps.runtime.outputs.aros_root }}'
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 >dist/xvfb.log 2>&1 &
          xvfb_pid=$!
          sleep 1

          set +e
          (
            cd "$aros_root"
            ./boot/linux/AROSBootstrap
          ) >dist/aros-runtime.log 2>&1 &
          aros_pid=$!
          set -e

          # User-Startup runs late in the normal Startup-Sequence, after
          # datatypes and GUI preferences have been initialised.
          found=0
          for i in $(seq 1 20); do
            if [ -s "$aros_root/dt-multiview-launched.txt" ]; then
              found=1
              break
            fi
            sleep 1
          done

          xwininfo -root -tree >dist/aros-window-tree.txt 2>&1 || true
          import -display :99 -window root dist/aros-desktop.png 2>dist/screenshot.log || true

          kill "$aros_pid" 2>/dev/null || true
          kill "$xvfb_pid" 2>/dev/null || true
          wait "$aros_pid" 2>/dev/null || true
          wait "$xvfb_pid" 2>/dev/null || true
          cat dist/aros-runtime.log
          cat dist/aros-window-tree.txt

          test "$found" -eq 1
          test -s "$aros_root/dt-user-startup-entered.txt"
          test -s "$aros_root/dt-multiview-launched.txt"
          cp "$aros_root/dt-user-startup-entered.txt" dist/
          cp "$aros_root/dt-multiview-launched.txt" dist/
          test -s dist/aros-desktop.png

          # Require X11 evidence for the guide/viewer, not merely successful
          # execution of the shell command.
          if ! grep -Eiq 'MultiView|ExampleAmiga' dist/aros-window-tree.txt; then
            echo 'No MultiView/ExampleAmiga window found in the AROS X11 tree.'
            exit 1
          fi

      - name: Record AROS native qualification
        run: |
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "aros_release=${{ steps.aros.outputs.tag }}"
            echo "fixture_sha256=$(cut -d' ' -f1 dist/ExampleAmiga.guide.sha256)"
            echo 'user_startup=PASS'
            echo 'multiview_launch=PASS'
            echo 'x11_window_evidence=PASS'
            echo 'screenshot=PASS'
            echo 'result=generated AmigaGuide opened in native AROS MultiView'
          } | tee dist/aros-amigaguide-qualification.txt

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aros-amigaguide-qualification
          path: |
            dist/ExampleAmiga.guide
            dist/ExampleAmiga.guide.sha256
            dist/AROSBootstrap.conf
            dist/Startup-Sequence.original
            dist/User-Startup.original
            dist/aros-runtime.log
            dist/xvfb.log
            dist/screenshot.log
            dist/aros-window-tree.txt
            dist/aros-desktop.png
            dist/dt-user-startup-entered.txt
            dist/dt-multiview-launched.txt
            dist/aros-amigaguide-qualification.txt
          if-no-files-found: warn
