name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate example source
        run: |
          python3 tools/validate-docs.py examples/ExampleAmigaManual.md
          python3 tools/validate-images.py examples/ExampleAmigaManual.md

      - name: Check local Markdown links
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' markdown_files < <(find . -type f -name '*.md' -not -path './.git/*' -print0)
          python3 tools/check-links.py "${markdown_files[@]}"

      - name: Check Markdown style
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' markdown_files < <(find . -type f -name '*.md' -not -path './.git/*' -print0)
          python3 tools/check-style.py "${markdown_files[@]}"

      - name: Validate required-section policy
        run: python3 tools/validate-policy.py examples/ExampleAmigaManual.md --profile amiga-cli --arexx

      - name: Run AmigaGuide generator regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Build and validate M2 AmigaGuide fixture
        run: |
          mkdir -p dist
          python3 tools/build-amigaguide.py examples/ExampleAmigaManual.md dist/ExampleAmiga.guide
          test -s dist/ExampleAmiga.guide
          python3 tools/validate-amigaguide.py dist/ExampleAmiga.guide
          grep -q '^@database ' dist/ExampleAmiga.guide
          grep -q '^@node Main ' dist/ExampleAmiga.guide
          grep -q '@{"Contents" link Main}' dist/ExampleAmiga.guide
          grep -q 'Documentation-Tools output architecture' dist/ExampleAmiga.guide

      - name: Check out the standard Amiga runtime
        uses: actions/checkout@v4
        with:
          repository: Ploos-AS/amiga-runtime
          ref: 327292c45d9440127b31ec9e289ad0416e26d781
          path: .ci/amiga-runtime

      - name: Prepare pending M2 native qualification bundle
        run: |
          python3 tools/prepare-m2-native-qualification.py --amiga-runtime .ci/amiga-runtime
          work=dist/m2-native-qualification/Work
          test -s "$work/ExampleAmiga.guide"
          test -s "$work/qualification-result.json"
          test -s "$work/QUALIFICATION-CHECKLIST.md"
          (cd "$work" && sha256sum --check SHA256SUMS)
          python3 - "$work/qualification-result.json" <<'PY'
          import json
          import pathlib
          import sys

          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert result["status"] == "PENDING"
          assert result["runtime"]["profile"] == "a500plus"
          assert result["source"]["amiga_runtime_commit"] == "327292c45d9440127b31ec9e289ad0416e26d781"
          assert len(result["qualification"]["results"]) == 13
          assert {item["status"] for item in result["qualification"]["results"]} == {"PENDING"}
          PY

      - name: Syntax-check Python tools
        run: python3 -m py_compile tools/*.py

      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-base texlive-latex-recommended texlive-latex-extra

      - name: Build M1 PDF fixture with rich image
        run: |
          sh tools/build-pdf.sh examples/ExampleAmigaManual.md dist/ExampleAmiga-0.0.0-m1-User-Manual.pdf ExampleAmiga 0.0.0-m1
          test -s dist/ExampleAmiga-0.0.0-m1-User-Manual.pdf
          pdfinfo dist/ExampleAmiga-0.0.0-m1-User-Manual.pdf | grep -q '^Pages:'
          pdftotext dist/ExampleAmiga-0.0.0-m1-User-Manual.pdf - | grep -q 'The diagram above is a local documentation asset'

      - name: Qualify M5 standalone HTML fixture with rich image
        shell: bash
        run: |
          set -euo pipefail
          html=dist/ExampleAmiga-0.0.0-m5-User-Manual.html
          sh tools/build-html.sh examples/ExampleAmigaManual.md "$html" ExampleAmiga 0.0.0-m5
          test -s "$html"
          grep -qi '<!DOCTYPE html' "$html"
          grep -q '<nav id="TOC"' "$html"
          grep -q 'ExampleAmiga User Manual' "$html"
          grep -q 'Version 0.0.0-m5' "$html"
          grep -q 'src="assets/architecture.svg"' "$html"
          grep -q 'alt="Documentation-Tools output architecture"' "$html"

      - name: Qualify reproducible builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/repro-a dist/repro-b
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          sh tools/build-pdf.sh examples/ExampleAmigaManual.md dist/repro-a/manual.pdf ExampleAmiga 0.0.0-m4
          python3 tools/build-amigaguide.py examples/ExampleAmigaManual.md dist/repro-a/manual.guide
          sleep 2
          sh tools/build-pdf.sh examples/ExampleAmigaManual.md dist/repro-b/manual.pdf ExampleAmiga 0.0.0-m4
          python3 tools/build-amigaguide.py examples/ExampleAmigaManual.md dist/repro-b/manual.guide
          cmp dist/repro-a/manual.pdf dist/repro-b/manual.pdf
          cmp dist/repro-a/manual.guide dist/repro-b/manual.guide
          sha256sum dist/repro-a/manual.pdf dist/repro-b/manual.pdf
          sha256sum dist/repro-a/manual.guide dist/repro-b/manual.guide

      - name: Qualify reusable action
        id: reusable
        uses: ./
        with:
          source: examples/ExampleAmigaManual.md
          project: ActionFixture
          version: 0.0.0-m5
          amiga: 'true'
          html: 'true'
          output-dir: dist/action

      - name: Verify reusable action outputs
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.reusable.outputs.pdf }}' = 'dist/action/ActionFixture-0.0.0-m5-User-Manual.pdf'
          test '${{ steps.reusable.outputs.guide }}' = 'dist/action/ActionFixture-0.0.0-m5.guide'
          test '${{ steps.reusable.outputs.html }}' = 'dist/action/ActionFixture-0.0.0-m5-User-Manual.html'
          test -s '${{ steps.reusable.outputs.pdf }}'
          test -s '${{ steps.reusable.outputs.guide }}'
          test -s '${{ steps.reusable.outputs.html }}'
          pdfinfo '${{ steps.reusable.outputs.pdf }}' | grep -q '^Pages:'
          python3 tools/validate-amigaguide.py '${{ steps.reusable.outputs.guide }}'
          grep -qi '<!DOCTYPE html' '${{ steps.reusable.outputs.html }}'
          grep -q '<nav id="TOC"' '${{ steps.reusable.outputs.html }}'
          grep -q 'src="assets/architecture.svg"' '${{ steps.reusable.outputs.html }}'

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: dist/
